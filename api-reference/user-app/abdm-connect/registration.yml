        copay_amount:
          description: The payer-declared patient-liable amount (ClaimResponse.total[copayment]).
          type: number
        copay_required:
          description: 'True when the payer has declared a patient-liable amount on
            this claim''s latest adjudication — the signal to enable the co-payment
            collection flow (and its mandatory beneficiary consent form) in the UI.
            Derived from the payer''s own response, NOT from a wallet-vs-claim comparison:
            the payer is authoritative on what the beneficiary owes, and its figure
            already accounts for scheme rules a naive balance subtraction would miss.'
          type: boolean
        created_at:
          format: date-time
          type: string
        deduction_pct:
          description: The payer's deduction on the final claim as a percentage of
            the submitted amount ((submitted − approved) / submitted × 100). Nil until
            an adjudicated final-claim request with both amounts exists.
          type:
          - "null"
          - number
        discharge_date:
          format: date-time
          type:
          - "null"
          - string
        discharge_type:
          type: string
        drafts:
          description: Lists the stages that have a saved (unsubmitted) draft — "Preauth"
            and/or "Claim". Present so the resume path can go straight to GET .../requests/draft:<Stage>
            instead of issuing speculative reads for ids that may not exist.
          items:
            type: string
          type: array
        max_queries_reached:
          type: boolean
        payer_code:
          type: string
        policy_id:
          description: The policy this case was created against. Serialized so a client
            resuming the case can key the procedure catalogue (GET /policies/:policyId/...)
            off it directly, instead of re-deriving it from a redundant, failure-prone
            POST /policies/search on every resume.
          minimum: 0
          type: integer
        preauth_case_no:
          type: string
        preauth_due_by:
          description: CreatedAt + 48h — the deadline to initiate a pre-auth after
            registration. Nil once a pre-auth has ever been submitted (the deadline
            no longer applies) or once the claim is archived.
          format: date-time
          type:
          - "null"
          - string
        preauth_overdue:
          description: True when PreAuthDueBy has passed and no pre-auth has been
            submitted — the claim is a candidate for the next ArchiveOverdueRegistrations
            sweep.
          type: boolean
        preauth_ref:
          type: string
        product_id:
          type: string
        provider_hfr:
          type: string
        query_count:
          description: 'How many times the payer has queried this claim''s pre-auth.
            MaxQueriesReached mirrors the UAT''s stated cap of 2 — informational:
            NHCX controls when it stops querying, this is not a limit we enforce on
            submission.'
          type: integer
        registration_details:
          description: The stored TC-04 registration enrichment (attendant, emergency
            and child document references) as captured at case creation — see models.StoredRegistration.
            Omitted when none was supplied. Document bytes are not inlined; the refs
            point to S3.
        review_path:
          description: 'Tells the FE which post-adjudication action to offer: "crc"
            — rejected, or deduction strictly > 20%: the one-shot CRC appeal (POST
            /claims/:claimId/claim/reprocess). "cpd_review" — deduction ≤ 20% (including
            exactly 20%): "erroneous claim"; CPD review, NOT appealable — the reprocess
            endpoint will refuse it. "" — no adjudicated deduction/rejection to act
            on, or the one-shot appeal is already used (see the claim''s reprocess
            request row / claim_reprocess_* status for its outcome).'
          type: string
        status:
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
