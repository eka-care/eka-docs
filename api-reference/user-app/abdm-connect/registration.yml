  /abdm/nhcx/v1/claims/{claimId}/preauth:
    post:
      description: 'Submits a pre-auth for the claim. request_type picks the workflow:
        InitialRequest, QueryResponse to answer a payer query, FollowUp to resubmit
        a rejected pre-auth, Enhancement to raise the approved scope. Everything the
        claim already knows (payer, policy, facility, patient) is filled in for you.
        The payer answers asynchronously: a 2xx means the request was sent, not approved.
        Track it with the returned request_id on Get Claim Request.'
      parameters:
      - description: Eka User ID (OID)
        in: header
        name: X-Pt-Id
        schema:
          type: string
      - description: Partner User ID
        in: header
        name: X-Partner-Pt-Id
        schema:
          type: string
      - description: Partner HIP ID
        in: header
        name: X-Hip-Id
        schema:
          type: string
      - description: claim_id returned by Create Claim
        in: path
        name: claimId
        required: true
        schema:
          description: claim_id returned by Create Claim
          minimum: 0
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                auth_type:
                  type: string
                clinical_notes:
                  type: string
                consent:
                  $ref: '#/components/schemas/ModelsPreAuthConsent'
                  description: Beneficiary authentication. AuthType "consent" (default)
                    sends the Authentication Consent Questionnaire response (Consent)
                    and OMITS the biometric X-Token; "biometric" sends UserToken as
                    the X-Token.
                diagnosis:
                  items:
                    $ref: '#/components/schemas/ModelsDiagnosisCoding'
                  type:
                  - array
                  - "null"
                items:
                  description: 'Carries the client-supplied deltas per procedure line:
                    speciality code, procedure code, claim amount, optional stratification
                    code, supporting docs, and questionnaire answers. Names/costs/mandatory-docs
                    are enriched server-side from the case''s catalog (catalog_md5).'
                  items:
                    $ref: '#/components/schemas/ModelsNHCXPreAuthItem'
                  type: array
                planned_end_date:
                  format: date-time
                  type:
                  - "null"
                  - string
                planned_start_date:
                  format: date-time
                  type:
                  - "null"
                  - string
                request_type:
                  type: string
                treating_doctor:
                  $ref: '#/components/schemas/ModelsTreatingDoctor'
                  description: NOT case-derivable — supplied by the caller (HMIS)
                    per submission.
                user_token:
                  type: string
              required:
              - request_type
              type: object
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NhcxError'
          description: ""
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NhcxError'
          description: ""
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsRequestIdModel'
          description: OK
      security:
      - authApiKey: []
      summary: Submit Pre-auth
