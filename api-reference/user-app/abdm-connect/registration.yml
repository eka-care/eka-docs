  /abdm/nhcx/v1/claims/{claimId}/biometric-auth/verify:
    post:
      description: Completes the authentication with the PID block from the RD-service
        scanner. Send the user_token with auth_type biometric on Submit Pre-auth or
        Submit Claim. For cyclic procedures send purpose cycle and procedure_code
        on every treatment visit.
      parameters:
      - description: Eka User ID (OID)
        in: header
        name: X-Pt-Id
        schema:
          type: string
      - description: Partner User ID
        in: header
        name: X-Partner-Pt-Id
        schema:
          type: string
      - description: Partner HIP ID
        in: header
        name: X-Hip-Id
        schema:
          type: string
      - description: claim_id returned by Create Claim
        in: path
        name: claimId
        required: true
        schema:
          description: claim_id returned by Create Claim
          minimum: 0
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                auth_mode:
                  type: string
                finger_print_auth_pid:
                  type: string
                iris_auth_pid:
                  type: string
                procedure_code:
                  description: 'Scopes a "cycle" capture to one billed procedure.
                    Required in practice when the case has more than one cyclic line
                    (an enhancement can add a second): the payer wants a separate
                    capture per procedure, and without this two same-day captures
                    collide.'
                  type: string
                process:
                  enum:
                  - Preauth
                  - Claim
                  - Discharge
                  type: string
                purpose:
                  description: 'Distinguishes the captures a cyclic course needs:
                    "cycle" for a per-treatment-visit capture, "discharge" for the
                    final one that authenticates the claim, "preauth" for the one
                    on the pre-auth. Optional — defaults to "preauth" on the Preauth
                    stage and "discharge" otherwise, so a non-cyclic flow needs no
                    change. **Send "cycle" for every treatment visit**: only those
                    rows carry the 24h re-capture gap, and only they become the claim''s
                    cycle_dates.'
                  enum:
                  - preauth
                  - cycle
                  - discharge
                  type: string
                txn_id:
                  type: string
              required:
              - process
              - auth_mode
              - txn_id
              type: object
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NhcxError'
          description: ""
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NhcxError'
          description: ""
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsBiometricAuthVerifyResponse'
          description: OK
      security:
      - authApiKey: []
      summary: Verify Biometric Auth
  /abdm/nhcx/v1/claims/{claimId}/claim:
    post:
      description: 'Submits the final claim after discharge. request_type is empty
        for the first submit, QueryResponse to answer a payer query, FollowUp to resubmit
        a rejected claim. The claimed amount is the sum of itemized_billing. The payer
        answers asynchronously: a 2xx means the request was sent, not approved. Track
        it with the returned request_id on Get Claim Request.'
      parameters:
      - description: Eka User ID (OID)
        in: header
        name: X-Pt-Id
        schema:
          type: string
      - description: Partner User ID
        in: header
        name: X-Partner-Pt-Id
        schema:
          type: string
      - description: Partner HIP ID
        in: header
        name: X-Hip-Id
        schema:
          type: string
      - description: claim_id returned by Create Claim
        in: path
        name: claimId
        required: true
        schema:
          description: claim_id returned by Create Claim
          minimum: 0
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                admission_date:
                  description: 'Optional: when supplied, each claim item''s servicedPeriod
                    spans admission..discharge (the full IPD stay). The case does
                    not currently capture an admission date, so without this the item
                    falls back to the discharge date alone as its serviced date.'
                  format: date-time
                  type:
                  - "null"
                  - string
                auth_type:
                  type: string
                care_team_members:
                  description: NOT case-derivable — supplied by the caller (HMIS)
                    per submission.
                  items:
                    $ref: '#/components/schemas/ModelsClaimCareTeamMember'
                  type: array
                consent:
                  $ref: '#/components/schemas/ModelsPreAuthConsent'
                  description: Beneficiary authentication. AuthType "consent" (default)
                    sends the Authentication Consent Questionnaire response (Consent)
                    and OMITS the biometric X-Token; "biometric" sends UserToken as
                    the X-Token.
                diagnosis:
                  description: The discharge diagnosis — NOT case-derivable (may differ
                    from the pre-auth diagnosis), supplied by the caller.
                  items:
                    $ref: '#/components/schemas/ModelsDiagnosisCoding'
                  type:
                  - array
                  - "null"
                discharge_date:
                  format: date-time
                  type:
                  - "null"
                  - string
                discharge_stage:
                  description: 'DIS valueString: "After surgery"(default) | ...'
                  type: string
                discharge_type:
                  description: '"home"(default) | "mortuary" | "lama" | "dama"'
                  type: string
                itemized_billing:
                  description: 'Carries the client-supplied deltas per line item:
                    service_code, quantity, unit_price. Category/display are optionally
                    enriched server-side from the case''s catalog (catalog_md5); TotalAmount
                    and the overall ClaimedAmount are always server-computed.'
                  items:
                    $ref: '#/components/schemas/ModelsBillingItem'
                  type: array
                remarks:
                  description: Free text; mandatory once the claim is submitted >15
                    days post-discharge. See validateClaimRequest's TAT-band check.
                  type: string
                request_type:
                  description: 'Selects the NHCX workflow for this claim submission,
                    mirroring preauth: "" / "InitialRequest" → first/final claim submit
                    (workflow 15) "QueryResponse" → answer a payer query on this claim
                    (workflow 151) "Resubmission"/"FollowUp" → resubmit a rejected
                    claim (workflow 16) A QueryResponse/Resubmission reuses the SAME
                    Claim.identifier (the payer''s CLN, stored on the claim as claim_ref)
                    so the payer links it to the queried/rejected claim — the correlation
                    id is fresh per exchange, linkage is CLN + workflow id (NHCX bundle-anatomy).
                    Empty = initial.'
                  type: string
                supporting_docs:
                  items:
                    $ref: '#/components/schemas/ModelsClaimSupportingDoc'
                  type: array
                user_token:
                  type: string
              type: object
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NhcxError'
          description: ""
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NhcxError'
          description: ""
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsRequestIdModel'
          description: OK
      security:
      - authApiKey: []
      summary: Submit Claim
