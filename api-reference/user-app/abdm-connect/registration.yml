    ServiceCatalogProcedure:
      properties:
        claim_amount:
          description: 'ClaimAmount / MandatoryDocs / STGForms are populated by GetProcedure''s
            join step (not stored directly on the Dynamo item) so existing consumers
            keep working unchanged: ClaimAmount mirrors the "Procedure" cost line
            (or the first cost line if none is typed "Procedure"); MandatoryDocs/STGForms
            are the joined documents'' MAND codes / STG display strings. MandatoryDocDetails
            is the same join''s full document records (category/code/display) keyed
            off MandCode, added so callers that need the richer metadata (e.g. enrichPreAuthItems
            filling CategoryDisplay/DocDisplay) don''t need a second CatalogStore
            call — it is additive and safe to ignore.'
          type: number
        code:
          type: string
        costs:
          items:
            $ref: '#/components/schemas/ServiceCatalogCost'
          type: array
        discharge_stages:
          type: string
        document_ids:
          items:
            type: string
          type: array
        flags:
          items:
            type: string
          type: array
        is_unspecified:
          description: 'Marks an "Unspecified Surgical Package" (code "<spec>U100").
            Derived from the code at read time (not stored), so the FE knows to render
            the free-text name + amount fields: these packages have no catalog price
            (ClaimAmount is the 9999999 sentinel) and the provider must supply both.
            Such an item also cannot be clubbed with other procedures — see unspecified_procedure.go.'
          type: boolean
        mandatory_doc_details:
          items:
            $ref: '#/components/schemas/ServiceCatalogDocument'
          type: array
        mandatory_docs:
          items:
            type: string
          type: array
        maximum_cycles_allowed:
          type: integer
        maximum_implants_allowed:
          type: integer
        maximum_stratification_allowed:
          type: integer
        name:
          type: string
        parent_procedure:
          description: The procedure an IMPLANT line attaches to (implant caps/flags
            live on that parent, not on the implant); DischargeStages is the LAMA/DAMA
            stage list. Both mirror NormProcedure — see the notes there.
          type: string
        parent_procedures:
          items:
            type: string
          type: array
        quantity_allowed:
          description: The four numeric Claim-Condition caps, mirroring NormProcedure's
            — see the note there for why they are not omitempty (0 is a real value)
            and why callers must gate on the matching Flags entry before reading a
            cap.
          type: integer
        questionnaire_ids:
          items:
            type: string
          type: array
        speciality_codes:
          items:
            type: string
          type: array
        standalone:
          description: 'Standalone / ParentProcedures are read-time conveniences for
            the FE''s payer-enforced standalone/parent-procedure validations: Standalone
            surfaces the Flags entry as a bool; ParentProcedures splits ParentProcedure''s
            comma list ("NA" normalised away). Derived in joinProcedureDocuments,
            not stored.'
          type: boolean
        stg_forms:
          items:
            type: string
          type: array
        type:
          type: string
      type: object
