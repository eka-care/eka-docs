  /abdm/nhcx/v1/claims/{claimId}/claim/reprocess:
    post:
      description: 'One-shot appeal of a rejected claim, or dispute of a claim settled
        with more than 20% deducted. A dispute needs a document; amount defaults to
        and cannot exceed the deduction. Get Claim''s review_path says when this is
        allowed. The payer answers asynchronously: a 2xx means the request was sent,
        not approved. Track it with the returned request_id on Get Claim Request.'
      parameters:
      - description: Eka User ID (OID)
        in: header
        name: X-Pt-Id
        schema:
          type: string
      - description: Partner User ID
        in: header
        name: X-Partner-Pt-Id
        schema:
          type: string
      - description: Partner HIP ID
        in: header
        name: X-Hip-Id
        schema:
          type: string
      - description: claim_id returned by Create Claim
        in: path
        name: claimId
        required: true
        schema:
          description: claim_id returned by Create Claim
          minimum: 0
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                amount:
                  description: 'Optionally overrides the disputed amount for an ERRONEOUS
                    (partial-payment) dispute. Default and maximum: submitted − approved
                    (the deduction). Ignored for a rejected-claim reprocess — the
                    payer requires NO amount there.'
                  type: number
                document:
                  $ref: '#/components/schemas/ServiceReprocessDocument'
                  description: The supporting evidence attached to the dispute Task.
                    MANDATORY for an erroneous (partial-payment) dispute — the payer
                    rejects a document-less erroneous; strongly recommended for a
                    rejected-claim reprocess.
                justification:
                  description: The provider's free-text case for reconsideration.
                    Persisted on the request detail; the wire Task carries the structured
                    reasonCode (the proven sample sends no free-text beyond description).
                  type: string
                reason:
                  $ref: '#/components/schemas/ModelsCodedReason'
                  description: Optionally overrides the claim-state-derived Task.reasonCode
                    with a caller-supplied NDHM code. When nil, the reason is chosen
                    from claim state (partialpayment / claimrejected).
              type: object
      responses:
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NhcxError'
          description: ""
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NhcxError'
          description: ""
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsRequestIdModel'
          description: OK
      security:
      - authApiKey: []
      summary: Reprocess Claim
  /abdm/nhcx/v1/claims/{claimId}/draft:
    put:
      description: Saves a partly filled pre-auth or claim form without submitting
