# The SDKs the generated changelog tracks. An install command alone cannot say whose package a name is, so a
# person lists each one here, checked against its registry. `npm run changelog` reads the latest version from
# the registry and writes an entry for a new minor or major release; patches are not news.
#
#   name      the package name, or the repository name for registry: github
#   registry  npm, pypi or github (GitHub releases, for SDKs installed from the repository)
#   repo      owner/name, for registry: github
#   product   the docs.json product item the SDK belongs to; leave it out for the platform changelog alone
#   page      the docs page that documents it, without .mdx; the SDK counts as withdrawn when the page is gone
#
# Not listed, and why:
#   echo-sdk on PyPI          belongs to another publisher; Eka's Agent Kit is eka-care/echo-sdk, listed below
#   ekacare-java-sdk          no published version found on Maven Central
#   scribe-python-sdk         installed from GitHub, which has no releases to read
#   eka-usage-sdk             documented only on an internal page

- name: "@eka-care/eka-care-core"
  registry: npm
  page: api-sdk/sdks/sdks/web-sdk/getting-started

- name: "@eka-care/ekascribe-ts-sdk"
  registry: npm
  product: Medical Scribe
  page: api-sdk/scribe/sdks/ekascribe-ts-sdk

- name: med-scribe-alliance-ts-sdk
  registry: npm
  product: Medical Scribe
  page: api-sdk/scribe/sdks/ts-sdk

- name: "@eka-care/medassist-core"
